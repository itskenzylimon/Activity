name: Activity gallery workspace
on:
  workflow_dispatch:
    inputs:
      quickey_ref:
        description: Reviewed QuickeyDB commit/ref containing the 3.0.0 API
        required: true
jobs:
  gallery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Activity/example
    steps:
      - uses: actions/checkout@v4
        with:
          path: Activity
      - uses: actions/checkout@v4
        with:
          repository: itskenzylimon/quickeydb
          ref: ${{ inputs.quickey_ref }}
          path: quickeydb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/test_web.dart
      - run: flutter build web --no-pub --no-web-resources-cdn --no-wasm-dry-run
